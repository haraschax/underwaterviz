<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Scripps Underwater Camera Log</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIHN0cm9rZT0ibm9uZSIgZD0iTTAgMGgyNHYyNEgweiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0xNi42OSA3LjQ0YTYuOTczIDYuOTczIDAgMCAwIC0xLjY5IDQuNTZjMCAxLjc0NyAuNjQgMy4zNDUgMS42OTkgNC41NzEiIC8+PHBhdGggZD0iTTIgOS41MDRjNy43MTUgOC42NDcgMTQuNzUgMTAuMjY1IDIwIDIuNDk4Yy01LjI1IC03Ljc2MSAtMTIuMjg1IC02LjE0MiAtMjAgMi41MDQiIC8+PHBhdGggZD0iTTE4IDExdi4wMSIgLz48cGF0aCBkPSJNMTEuNSAxMC41Yy0uNjY3IDEgLS42NjcgMiAwIDMiIC8+PC9zdmc+' />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 6px;
    }
    #breadcrumb {
      margin: 20px 0;
      font-size: 14px;
    }
    #breadcrumb span {
      color: #0074d9;
      cursor: pointer;
    }
    #breadcrumb span + span:before {
      content: ' / ';
      color: #555;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .item {
      font: inherit;
      color: inherit;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px 15px;
      min-width: 80px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .item:hover {
      background-color: #f0f8ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }
    .grid img {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .snapshot {
      position: relative;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: #e3e9eb;
      min-width: 0;
      cursor: pointer;
    }
    .snapshot-label {
      position: absolute;
      bottom: 4px;
      left: 4px;
      padding: 2px 4px;
      font-size: 12px;
      color: white;
      background: rgba(0,0,0,0.5);
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .overlay-container {
      position: relative;
      max-width: 90%;
      max-height: 90%;
    }
    .overlay-container img {
      max-width: 100%;
      max-height: 90vh;
    }
    .overlay-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      padding: 4px 8px;
      font-size: 16px;
      color: white;
      background-color: rgba(0,0,0,0.6);
      border-radius: 3px;
    }
    .overlay-vis {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 3px;
      color: white;
    }
    .overlay-tide {
      position: absolute;
      top: 46px;
      right: 8px;
      padding: 4px 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 3px;
      color: white;
      background-color: rgba(0, 95, 150, 0.8);
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: #888;
    }
    .vis-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      color: white;
    }
    .tide-badge {
      position: absolute;
      top: 30px;
      right: 4px;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      color: white;
      background-color: rgba(0, 95, 150, 0.8);
    }
    .visibility-chart {
      max-width: 1100px;
      margin: 20px auto;
      padding: 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .visibility-chart h2 { text-align: center; margin: 4px 0 16px; }
    .chart-toolbar, .chart-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chart-toolbar button {
      font: inherit;
      font-size: 13px;
      padding: 8px 11px;
      background: #fff;
      border: 1px solid #ccd5d9;
      border-radius: 4px;
      cursor: pointer;
    }
    .chart-toolbar button[aria-pressed="true"] { background: #e7f3fa; border-color: #0074d9; }
    .chart-toolbar button:disabled { opacity: 0.4; cursor: default; }
    .chart-zoom { display: inline-flex; gap: inherit; }
    .chart-range { margin-left: auto; font-size: 13px; color: #555; }
    .chart-plot { position: relative; margin-top: 10px; }
    .chart-plot canvas { display: block; width: 100%; height: 390px; touch-action: pan-y; cursor: crosshair; }
    .chart-plot canvas:focus-visible { outline: 2px solid #0074d9; outline-offset: 2px; }
    .chart-tooltip {
      position: absolute;
      max-width: 220px;
      padding: 9px 12px;
      border-radius: 5px;
      background: #173643;
      color: white;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      box-shadow: 0 2px 8px #0003;
    }
    .chart-tooltip strong { display: block; font-size: 17px; }
    .chart-legend { justify-content: center; gap: 20px; font-size: 13px; }
    .chart-legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .chart-key { display: inline-block; width: 18px; height: 3px; background: #222; }
    .chart-key.hourly { width: 9px; height: 9px; border-radius: 50%; background: #087bb5; }
    .chart-announcement { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 600px) {
      .visibility-chart { padding: 12px 6px; }
      .chart-toolbar { padding: 0 6px; gap: 6px; }
      .chart-toolbar button { font-size: 12px; padding: 8px; }
      .chart-range { flex-basis: 100%; margin: 4px 0; }
      .chart-plot canvas { height: 310px; }
    }
  </style>
</head>
<body>
  <h1>Scripps Underwater Camera Log</h1>
  <div id="breadcrumb"></div>
  <div id="content"></div>

  <script>
    const rawBase = 'https://raw.githubusercontent.com/haraschax/underwaterviz/master/snapshots';

    const breadcrumbDiv = document.getElementById('breadcrumb');
    const contentDiv = document.getElementById('content');

    const monthNames = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December'
    ];
    const monthAbbrev = [
      'jan','feb','mar','apr','may','jun',
      'jul','aug','sep','oct','nov','dec'
    ];

    let currentYear = null;
    let currentMonth = null;
    let viewController = null;
    let measurementsPromise = null;

    function beginView() {
      if (viewController) viewController.abort();
      viewController = new AbortController();
      contentDiv.replaceChildren();
      overlay.style.display = 'none';
      return viewController.signal;
    }

    // Measurement data
    let visibilityData = {};
    let tideData = {};

    // Overlay for full-screen image view
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const overlayContainer = document.createElement('div');
    overlayContainer.className = 'overlay-container';
    const overlayImg = document.createElement('img');
    const overlayLabel = document.createElement('div');
    overlayLabel.className = 'overlay-label';
    const overlayVis = document.createElement('div');
    overlayVis.className = 'overlay-vis';
    const overlayTide = document.createElement('div');
    overlayTide.className = 'overlay-tide';
    overlayContainer.appendChild(overlayImg);
    overlayContainer.appendChild(overlayLabel);
    overlayContainer.appendChild(overlayVis);
    overlayContainer.appendChild(overlayTide);
    overlay.appendChild(overlayContainer);
    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') overlay.style.display = 'none';
    });
    document.body.appendChild(overlay);

    function openModal(src, alt = '', visFt = null, conditions = '', tideFt = null) {
      overlayImg.src = src;
      overlayImg.alt = alt;
      overlayLabel.textContent = alt;
      if (visFt != null && !isNaN(visFt)) {
        overlayVis.textContent = `~${Math.round(visFt)} ft`;
        if (conditions) overlayVis.title = conditions;
        if (visFt >= 20) overlayVis.style.backgroundColor = 'rgba(0, 150, 0, 0.75)';
        else if (visFt >= 12) overlayVis.style.backgroundColor = 'rgba(0, 120, 200, 0.75)';
        else overlayVis.style.backgroundColor = 'rgba(200, 80, 0, 0.75)';
        overlayVis.style.display = '';
      } else {
        overlayVis.style.display = 'none';
      }
      if (tideFt != null && !isNaN(tideFt)) {
        overlayTide.textContent = `Tide ${tideFt.toFixed(1)} ft`;
        overlayTide.title = 'NOAA La Jolla station 9410230; observed water level relative to MLLW';
        overlayTide.style.display = '';
      } else {
        overlayTide.style.display = 'none';
      }
      overlay.style.display = 'flex';
    }

    // --- Measurement loading ---

    async function loadVisibilityData() {
      try {
        const response = await fetch('visibility.json');
        if (!response.ok) return;
        visibilityData = await response.json();
      } catch (e) {
        console.error('Failed to load visibility data:', e);
      }
    }

    async function loadTideData() {
      try {
        const response = await fetch('tides.csv');
        if (!response.ok) return;
        const text = await response.text();
        const lines = text.trim().split('\n');
        for (let i = 1; i < lines.length; i++) {
          const columns = lines[i].split(',');
          if (columns.length < 2) continue;
          const key = columns[0].trim().substring(0, 13);
          const tideFt = parseFloat(columns[1]);
          if (key && !isNaN(tideFt)) tideData[key] = tideFt;
        }
      } catch (e) {
        console.error('Failed to load tide data:', e);
      }
    }

    function getTide(year, month, day, hour) {
      const key = `${year}-${month}-${String(day).padStart(2, '0')} ${String(hour).padStart(2, '0')}`;
      return tideData[key] ?? null;
    }

    function createVisBadge(visFt, conditions) {
      const badge = document.createElement('div');
      badge.className = 'vis-badge';
      if (conditions) badge.title = conditions;
      if (visFt == null || isNaN(visFt)) {
        badge.textContent = 'Visibility n/a';
        badge.style.backgroundColor = 'rgba(100, 100, 100, 0.75)';
      } else {
        badge.textContent = `~${Math.round(visFt)} ft`;
        if (visFt >= 20) {
          badge.style.backgroundColor = 'rgba(0, 150, 0, 0.75)';
        } else if (visFt >= 12) {
          badge.style.backgroundColor = 'rgba(0, 120, 200, 0.75)';
        } else {
          badge.style.backgroundColor = 'rgba(200, 80, 0, 0.75)';
        }
      }
      return badge;
    }

    function createTideBadge(tideFt) {
      const badge = document.createElement('div');
      badge.className = 'tide-badge';
      badge.title = 'NOAA La Jolla station 9410230; observed water level relative to MLLW';
      if (tideFt == null || isNaN(tideFt)) {
        badge.textContent = 'Tide n/a';
        badge.style.backgroundColor = 'rgba(100, 100, 100, 0.75)';
      } else {
        badge.textContent = `Tide ${tideFt.toFixed(1)} ft`;
      }
      return badge;
    }

    // --- URL routing helpers ---

    function monthSlug(year, month) {
      const mIdx = parseInt(month, 10) - 1;
      return `${year}${monthAbbrev[mIdx]}`;
    }

    function parseMonthSlug(slug) {
      // Parse "2026jan" -> { year: "2026", month: "01" }
      const match = slug.match(/^(\d{4})([a-z]{3})$/);
      if (!match) return null;
      const year = match[1];
      const abbr = match[2];
      const idx = monthAbbrev.indexOf(abbr);
      if (idx === -1) return null;
      return { year, month: String(idx + 1).padStart(2, '0') };
    }

    // --- Breadcrumb ---

    function setBreadcrumb(parts) {
      breadcrumbDiv.innerHTML = '';
      parts.forEach((part, idx) => {
        const span = document.createElement('span');
        span.textContent = part;
        span.addEventListener('click', () => {
          if (parts[0] === 'Home') {
            if (idx === 0) {
              history.pushState({ view: 'months' }, '', '/');
              loadAllMonths();
            } else if (idx === 1) {
              if (currentYear && currentMonth) {
                loadDays(currentYear, currentMonth);
              }
            }
          }
        });
        breadcrumbDiv.appendChild(span);
      });
    }

    function createItem(name, onClick) {
      const div = document.createElement('button');
      div.type = 'button';
      div.className = 'item';
      div.textContent = name;
      div.addEventListener('click', onClick);
      return div;
    }

    function createSnapshot(info, index = 0) {
      const {year, month, day, file, visibility_ft: visFt, conditions: cond, tide_ft: tideFt} = info;
      const hour = file.split('.')[0].padStart(2, '0');
      const dateLabel = `${year}-${month}-${day} ${hour}:00`;
      const fullSrc = info.fullSrc || `${rawBase}/${year}/${month}/${day}/${file}`;
      const wrapper = document.createElement('button');
      wrapper.type = 'button';
      wrapper.className = 'snapshot';
      wrapper.setAttribute('aria-label', `Open ${dateLabel}`);
      const img = document.createElement('img');
      img.width = 480;
      img.height = 235;
      img.loading = index < 4 ? 'eager' : 'lazy';
      img.decoding = 'async';
      if (index === 0) img.fetchPriority = 'high';
      img.alt = dateLabel;
      img.title = dateLabel;
      img.src = `thumbnails/${year}/${month}/${day}/${hour}.jpg`;
      const label = document.createElement('span');
      label.className = 'snapshot-label';
      label.textContent = dateLabel;
      wrapper.append(img, label, createVisBadge(visFt, cond), createTideBadge(tideFt));
      wrapper.addEventListener('click', () => openModal(fullSrc, dateLabel, visFt, cond, tideFt));
      return wrapper;
    }

    // --- Last 7 days ---

    async function loadLast7DaysImages(parent, signal) {
      try {
        const response = await fetch('last7days/last7days.json', { signal });
        if (!response.ok) return;
        const imagesInfo = await response.json();
        if (signal.aborted) return;
        if (!Array.isArray(imagesInfo) || imagesInfo.length === 0) return;

        const section = document.createElement('div');
        const heading = document.createElement('h2');
        heading.textContent = 'Midday images from the last 7 days';
        heading.style.textAlign = 'center';
        section.appendChild(heading);
        const grid = document.createElement('div');
        grid.className = 'grid';

        imagesInfo.forEach((info, index) => {
          const [year, month, day] = info.date.split('-');
          grid.appendChild(createSnapshot({
            year, month, day, file: `${info.time}.png`,
            fullSrc: `last7days/${info.file}`,
            visibility_ft: info.visibility_ft ?? null,
            conditions: info.conditions || '',
            tide_ft: getTide(year, month, day, parseInt(info.time, 10))
          }, index));
        });

        section.appendChild(grid);
        parent.appendChild(section);
      } catch (err) {
        if (!signal.aborted) console.error(err);
      }
    }

    // --- All months view (home) ---

    async function loadAllMonths() {
      const signal = beginView();
      if (!history.state || history.state.view !== 'months') {
        history.replaceState({ view: 'months' }, '', '/');
      }
      setBreadcrumb(['Home']);
      const chart = document.createElement('div');
      const recent = document.createElement('div');
      contentDiv.append(chart, recent);
      if (!measurementsPromise) {
        measurementsPromise = Promise.all([loadVisibilityData(), loadTideData()]);
      }
      measurementsPromise.then(() => {
        if (signal.aborted) return;
        loadLast7DaysImages(recent, signal);
      });
      Promise.all([measurementsPromise, import('./visibility-chart.js')]).then(([, module]) => {
        if (!signal.aborted) module.renderVisibilityChart(chart, visibilityData, signal);
      }).catch(error => {
        if (signal.aborted) return;
        console.error(error);
        chart.textContent = 'Could not load the visibility chart. Please reload to try again.';
      });

      const heading = document.createElement('h2');
      heading.textContent = 'Browse historical pictures';
      heading.style.textAlign = 'center';
      heading.style.marginTop = '20px';
      contentDiv.appendChild(heading);

      try {
        const response = await fetch('months.json', { signal });
        if (!response.ok) throw new Error('Failed to load months manifest');
        const monthsList = await response.json();
        if (signal.aborted) return;
        if (!Array.isArray(monthsList) || monthsList.length === 0) throw new Error('Invalid months manifest');

        monthsList.sort((a, b) => {
          const ya = parseInt(a.year, 10), yb = parseInt(b.year, 10);
          if (ya !== yb) return yb - ya;
          return parseInt(b.month, 10) - parseInt(a.month, 10);
        });

        const container = document.createElement('div');
        container.className = 'container';
        monthsList.forEach(entry => {
          const mNum = parseInt(entry.month, 10);
          const displayName = `${monthNames[mNum - 1]} ${entry.year}`;
          container.appendChild(createItem(displayName, () => loadDays(entry.year, entry.month, true)));
        });
        contentDiv.appendChild(container);
      } catch (err) {
        if (signal.aborted) return;
        console.error(err);
        const msg = document.createElement('p');
        msg.textContent = 'No historical images are available.';
        msg.style.textAlign = 'center';
        msg.style.marginTop = '15px';
        contentDiv.appendChild(msg);
      }

      const heading2 = document.createElement('h2');
      heading2.textContent = 'The Scripps Underwater Cam';
      heading2.style.textAlign = 'center';
      heading2.style.marginTop = '18px';
      contentDiv.appendChild(heading2);

      const infoP = document.createElement('p');
      infoP.append('This website is just a historical log of the Scripps Pier Underwater Camera: ');
      const link = document.createElement('a');
      link.href = 'https://coollab.ucsd.edu/pierviz/';
      link.textContent = 'https://coollab.ucsd.edu/pierviz/';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      infoP.appendChild(link);
      infoP.append('. This website is completely open-source, feel free to contribute: ');
      const link2 = document.createElement('a');
      link2.href = 'https://github.com/haraschax/underwaterviz';
      link2.textContent = 'https://github.com/haraschax/underwaterviz';
      link2.target = '_blank';
      link2.rel = 'noopener noreferrer';
      infoP.appendChild(link2);
      infoP.append(
        '. The underwater cam is a great tool to estimate underwater visibility in La Jolla for snorkeling or diving.',
        document.createElement('br'),
        document.createElement('br'),
        'Water visibility can be estimated from the pier pilings and water colour. ',
        'The closest pier piling on the right is 1.2m (4 ft) away from the camera and ',
        'the piling on the right back of the screen is 3.4m (11 ft). The back left ',
        'piling is 4.3m (14 ft) away from the camera and may only be visible when ocean ',
        'conditions are calm and clear (light blue water). If you can see two pier ',
        'pilings on the left, the farthest one is 9m (30 ft) away, and visibility rarely ',
        'gets this good. Below is an example of great visibility:',
      );
      infoP.style.marginTop = '20px';
      infoP.style.maxWidth = '800px';
      infoP.style.marginLeft = 'auto';
      infoP.style.marginRight = 'auto';
      infoP.style.lineHeight = '1.4';
      contentDiv.appendChild(infoP);

      const exampleImg = document.createElement('img');
      exampleImg.loading = 'lazy';
      exampleImg.decoding = 'async';
      exampleImg.src = 'great_visibility.png';
      exampleImg.alt = 'Example of great underwater visibility';
      exampleImg.style.display = 'block';
      exampleImg.style.margin = '10px auto 30px';
      exampleImg.style.maxWidth = '800px';
      exampleImg.style.width = '100%';
      contentDiv.appendChild(exampleImg);
    }

    // --- Month view (flattened days) ---

    async function loadDays(year, month, pushHistory = false) {
      const signal = beginView();
      currentYear = year;
      currentMonth = month;
      const slug = monthSlug(year, month);

      if (pushHistory) {
        history.pushState({ view: 'month', year, month }, '', `/${slug}`);
      }

      const monthDisplay = `${monthNames[parseInt(month, 10) - 1]} ${year}`;
      setBreadcrumb(['Home', monthDisplay]);

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'loading';
      loadingDiv.setAttribute('role', 'status');
      loadingDiv.textContent = 'Loading images...';
      contentDiv.appendChild(loadingDiv);

      try {
        const response = await fetch(`months/${year}-${month}.json`, { signal });
        if (!response.ok) throw new Error(`Failed to load month: ${response.status}`);
        const images = await response.json();
        if (signal.aborted) return;
        if (images.length === 0) {
          loadingDiv.textContent = 'No images are available for this month.';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'grid';
        images.forEach((info, index) => {
          grid.appendChild(createSnapshot({ ...info, year, month }, index));
        });
        contentDiv.replaceChildren(grid);
      } catch (err) {
        if (signal.aborted) return;
        console.error(err);
        loadingDiv.textContent = 'Could not load this month. ';
        loadingDiv.appendChild(createItem('Try again', () => loadDays(year, month)));
      }
    }

    // --- URL routing on page load ---

    function routeFromURL() {
      // Check for redirect from 404.html
      let redirectPath = null;
      try {
        redirectPath = sessionStorage.getItem('redirect_path');
        if (redirectPath) sessionStorage.removeItem('redirect_path');
      } catch (e) {}
      const path = (redirectPath || window.location.pathname).replace(/^\/+|\/+$/g, '');
      if (path) {
        const parsed = parseMonthSlug(path);
        if (parsed) {
          history.replaceState({ view: 'month', year: parsed.year, month: parsed.month }, '', `/${path}`);
          loadDays(parsed.year, parsed.month);
          return;
        }
      }
      loadAllMonths();
    }

    // Handle browser back/forward
    window.addEventListener('popstate', (event) => {
      const state = event.state;
      if (!state || !state.view || state.view === 'months') {
        loadAllMonths();
      } else if (state.view === 'month') {
        loadDays(state.year, state.month);
      }
    });
