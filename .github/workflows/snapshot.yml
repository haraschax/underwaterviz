name: Take hourly underwater snapshot

on:
  schedule:
    # Run at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token:  ${{ secrets.MY_TOKEN }}
      - name: Set timezone (optional)
        run: echo "TZ=America/Los_Angeles" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install selenium Pillow openai
      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: '152.0.7977.42'
          install-chromedriver: true
          install-dependencies: true
      - name: Run snapshot script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python grab_snapshot.py
      - name: Update tide levels
        run: python backfill_tides.py
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "periodic update"
